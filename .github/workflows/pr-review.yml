name: Central AI PR Review

on:
  workflow_call:
    inputs:
      ai-model:
        description: 'Gemini model to use for code review'
        required: false
        type: string
        default: 'gemini-3.8-flash'
      ai-model-deep:
        description: 'Gemini model to use for deep review'
        required: false
        type: string
        default: 'gemini-3.8-flash'
    secrets:
      GEMINI_API_KEY:
        description: 'Gemini API key for generating AI reviews'
        required: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  review:
    name: Execute PR Review
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    uses: Karthik22296/pr-review-agent/.github/workflows/pr-review.yml@main
    with:
      ai-model: ${{ inputs.ai-model }}
      ai-model-deep: ${{ inputs.ai-model-deep }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
